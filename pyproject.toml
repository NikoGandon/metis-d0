[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metis"
version = "2.2.0"
description = "Mêtis D0 : orchestrateur multi-agents d'audit documentaire fail-closed à garde-fous déterministes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.setuptools.packages.find]
include = ["metis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "docker: nécessite le backend sandbox docker (exclu par défaut avec -m 'not docker')",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
